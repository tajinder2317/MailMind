version: '3.8'

services:
  # MailMind Application
  mailmind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailmind-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mailmind:${POSTGRES_PASSWORD}@db:5432/mailmind
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GMAIL_CREDENTIALS_PATH=/app/config/credentials.json
      - GMAIL_TOKEN_PATH=/app/config/token.json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_WORKERS=${MAX_WORKERS:-10}
      - OCR_LANGUAGE=${OCR_LANGUAGE:-eng}
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - gmail_tokens:/app/tokens
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mailmind-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Streamlit Frontend
  mailmind-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mailmind-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://mailmind:8000
      - FRONTEND_PORT=8501
      - DEBUG_MODE=${DEBUG_MODE:-false}
      - USER_ID=${USER_ID:-demo_user}
      - CACHE_TTL=300
      - ENABLE_CACHING=true
      - MAX_GRAPH_NODES=50
      - DEFAULT_SEARCH_LIMIT=10
      - SEARCH_TIMEOUT=30
      - SYNC_REFRESH_INTERVAL=5
      - AUTO_REFRESH_SYNC=true
    volumes:
      - ./frontend:/app
    depends_on:
      mailmind:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mailmind-network
    profiles:
      - frontend

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: mailmind-db
    environment:
      - POSTGRES_DB=mailmind
      - POSTGRES_USER=mailmind
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - mailmind-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mailmind -d mailmind" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: mailmind-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
      - ./config/qdrant_config.yaml:/qdrant/config/production.yaml
    restart: unless-stopped
    networks:
      - mailmind-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:6333/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: mailmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    networks:
      - mailmind-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: mailmind-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./config/ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - mailmind
    restart: unless-stopped
    networks:
      - mailmind-network
    profiles:
      - production

  # Monitoring with Prometheus (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: mailmind-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - mailmind-network
    profiles:
      - monitoring

  # Grafana for monitoring dashboard (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: mailmind-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - mailmind-network
    profiles:
      - monitoring

  # Log aggregation with ELK Stack (Optional)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: mailmind-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped
    networks:
      - mailmind-network
    profiles:
      - logging

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: mailmind-logstash
    volumes:
      - ./config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./logs:/app/logs
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - mailmind-network
    profiles:
      - logging

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: mailmind-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - mailmind-network
    profiles:
      - logging

# Volumes for data persistence
volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  gmail_tokens:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

# Networks
networks:
  mailmind-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
